<title>DialTone Messenger</title>
<style>
/* Layout: one fixed teal desktop, draggable grey bevelled windows, taskbar pinned to the bottom. Single committed look. */
:root{
  --desk:#008080; --face:#c0c0c0; --hi:#ffffff; --lite:#dfdfdf; --shade:#808080; --dark:#0a0a0a;
  --title:#000080; --title2:#1084d0; --title-fg:#ffffff; --title-off:#808080; --title-off-fg:#c0c0c0;
  --field:#ffffff; --text:#000000; --mute:#555555; --sel:#000080; --sel-fg:#ffffff;
  --me:#cc0000; --them:#0000cc; --sys:#666666; --tip:#ffffe1; --sun:#ffd400;
  --ui:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Geneva,Verdana,sans-serif;
  --chat:"Times New Roman",Times,serif;
  --mono:"Courier New",Courier,monospace;
  --bar:30px;
  --link:#0000ee; --vlink:#551a8b; --night:#000022; --lime:#33ff66; --warn:#ffcc00;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--text);font:12px/1.3 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:var(--text)}
#desk{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));overflow:hidden}
#icons{position:absolute;left:16px;top:14px;bottom:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:18px 10px}
.dicon{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:2px;color:var(--hi);text-align:center;cursor:pointer}
.dicon span{padding:1px 3px;text-shadow:1px 1px var(--dark)}
.dicon:focus-visible span,.dicon:active span{background:var(--sel);outline:1px dotted var(--hi)}
.dicon svg{width:32px;height:32px;image-rendering:pixelated}

.out{background:var(--face);border:2px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px var(--shade),inset 1px 1px var(--lite)}
.in{background:var(--field);border:2px solid;border-color:var(--shade) var(--hi) var(--hi) var(--shade);box-shadow:inset 1px 1px var(--dark),inset -1px -1px var(--lite)}
.btn{background:var(--face);border:2px solid;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px var(--shade),inset 1px 1px var(--lite);padding:3px 8px;min-height:23px;cursor:pointer;white-space:nowrap}
.btn:active,.btn.on{border-color:var(--dark) var(--hi) var(--hi) var(--dark);box-shadow:inset 1px 1px var(--shade),inset -1px -1px var(--lite);padding:4px 7px 2px 9px}
.btn:focus-visible{outline:1px dotted var(--dark);outline-offset:-5px}
.btn:disabled{color:var(--shade);text-shadow:1px 1px var(--hi);cursor:default}
input[type=text],input[type=password],input[type=email],textarea,select{background:var(--field);border:2px solid;border-color:var(--shade) var(--hi) var(--hi) var(--shade);box-shadow:inset 1px 1px var(--dark);padding:3px 4px;border-radius:0;-webkit-user-select:text;user-select:text;min-width:0}
input[type=text]:focus,input[type=password]:focus,input[type=email]:focus,textarea:focus,select:focus{outline:1px dotted var(--dark);outline-offset:1px}
textarea{resize:none;display:block;width:100%}

.win{position:absolute;display:flex;flex-direction:column;padding:2px;max-width:calc(100% - 8px);max-height:100%}
.tb{display:flex;align-items:center;gap:4px;background:var(--title-off);color:var(--title-off-fg);padding:2px 2px 2px 4px;font-weight:bold;cursor:default;touch-action:none;flex:none}
.win.act .tb{background:linear-gradient(90deg,var(--title),var(--title2));color:var(--title-fg)}
.tb .tt{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb .dot{width:12px;height:12px;background:var(--sun);border:1px solid var(--dark);flex:none}
.tb button{width:18px;height:16px;min-height:0;padding:0;font:bold 10px/1 var(--ui);flex:none}
.tb button:active{padding:1px 0 0 1px}
.wb{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
label{display:block}
.note{color:var(--mute)}
.fs{border:2px groove var(--lite);padding:8px;margin:0;display:flex;flex-direction:column;gap:6px}
.fs legend{padding:0 4px}

/* sign on */
.brand{background:var(--title);color:var(--hi);padding:14px 10px;display:flex;align-items:center;gap:12px}
.brand svg{width:56px;height:56px;flex:none}
.brand b{font:italic bold 30px/1 var(--chat);letter-spacing:-.5px;display:block}
.brand i{font:normal 11px var(--ui);letter-spacing:3px;text-transform:uppercase;color:var(--sun)}
.prog{height:18px;padding:2px;display:flex;gap:2px}
.prog s{flex:1;background:var(--title);opacity:0}
.prog s.f{opacity:1}

/* buddy list */
.tree{flex:1;min-height:80px;overflow-y:auto;padding:2px;font-size:12px}
.grp{font-weight:bold;padding:2px 2px;cursor:pointer;display:flex;gap:4px}
.grp:focus-visible,.bud:focus-visible,.li:focus-visible{outline:1px dotted var(--dark)}
.bud,.li{padding:2px 4px 2px 18px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li{padding-left:4px}
.bud.away{font-style:italic;color:var(--mute)}
.bud.off{color:var(--shade)}
.bud.sel,.li.sel{background:var(--sel);color:var(--sel-fg)}
.empty{padding:10px 6px;color:var(--mute);white-space:normal}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.grid4 .btn{padding-left:2px;padding-right:2px}
.status{padding:2px 5px;border:1px solid;border-color:var(--shade) var(--hi) var(--hi) var(--shade);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* transcripts */
.log{flex:1;min-height:60px;overflow-y:auto;padding:4px 6px;font:14px/1.35 var(--chat);-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.log p{margin:0 0 2px}
.log .sn{font-weight:bold}
.log .me{color:var(--me)} .log .them{color:var(--them)}
.log .sys{color:var(--sys);font-style:italic;font-size:13px}
.log .btn{font:12px var(--ui);margin-left:6px}
.fmt{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.fmt .btn{width:24px;padding:2px 0;font-family:var(--chat);font-size:13px}
.fmt .btn.on{padding:3px 0 1px 1px}
.split{flex:1;min-height:0;display:flex;gap:6px}
.who{width:112px;flex:none;overflow-y:auto;padding:2px}
.pre{font:12px/1.4 var(--mono);white-space:pre-wrap;padding:6px;overflow-y:auto;flex:1;-webkit-user-select:text;user-select:text}

/* taskbar */
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar) + env(safe-area-inset-bottom,0px));padding:3px 3px calc(3px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;align-items:stretch;background:var(--face);border-top:2px solid var(--hi);z-index:9000}
#start{font-weight:bold;display:flex;align-items:center;gap:5px;flex:none}
#start i{width:14px;height:14px;background:conic-gradient(var(--me) 25%,var(--sun) 0 50%,var(--title) 0 75%,var(--desk) 0);border:1px solid var(--dark)}
#tasks{flex:1;min-width:0;display:flex;gap:3px;overflow:hidden}
#tasks .btn{flex:0 1 150px;min-width:36px;overflow:hidden;text-overflow:ellipsis;text-align:left}
#tasks .btn.on{font-weight:bold}
#tasks .btn.flash{background:var(--title);color:var(--title-fg)}
#clock{flex:none;display:flex;align-items:center;padding:0 8px;border:1px solid;border-color:var(--shade) var(--hi) var(--hi) var(--shade);font-variant-numeric:tabular-nums}
#menu{position:fixed;left:2px;bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px));width:190px;display:flex;z-index:9001;padding:2px}
#menu .side{width:22px;background:var(--shade);color:var(--face);font:bold 14px var(--ui);writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 2px;text-align:left}
#menu .items{flex:1;display:flex;flex-direction:column}
#menu button{background:none;border:0;text-align:left;padding:7px 10px;cursor:pointer}
#menu button:hover,#menu button:focus-visible{background:var(--sel);color:var(--sel-fg);outline:0}
#menu hr{border:0;border-top:1px solid var(--shade);border-bottom:1px solid var(--hi);margin:2px 3px;width:auto}
@media (prefers-reduced-motion:no-preference){#tasks .btn.flash{animation:fl 1s steps(1) infinite}}
@keyframes fl{50%{background:var(--face);color:var(--text)}}
/* web browser */
.mbar{display:flex;gap:10px;align-items:center;padding:1px 4px}
.throb{width:18px;height:18px;border:1px solid var(--dark);background:conic-gradient(var(--title) 25%,var(--sun) 0 50%,var(--title) 0 75%,var(--sun) 0)}
@media (prefers-reduced-motion:no-preference){.throb.go{animation:spin .6s steps(4) infinite}.blink{animation:bl 1s steps(1) infinite}}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes bl{50%{opacity:0}}
.tiles{display:flex;gap:6px}.tile{flex:1;padding:14px 4px;text-align:center;color:var(--shade);background:var(--face)}.tile.lit{background:var(--title);color:var(--sun);font-weight:bold}
.web{flex:1;min-height:80px;overflow:auto;padding:10px 12px;font:15px/1.4 var(--chat);-webkit-user-select:text;user-select:text;overflow-wrap:anywhere}
.web h1{font-size:24px;margin:0 0 8px;text-wrap:balance}.web h2{font-size:18px;margin:14px 0 6px}.web p{margin:0 0 8px}.web ul,.web ol{margin:0 0 8px;padding-left:26px}
.web a{color:var(--link)}.web a.v{color:var(--vlink)}.web hr{border:0;border-top:1px solid var(--shade);border-bottom:1px solid var(--lite);margin:12px 0}
.web .small{font-size:12px;color:var(--mute)}.web .btn,.web input,.web textarea,.web label{font:12px var(--ui)}
.web .banner{background:var(--title);color:var(--hi);padding:10px;text-align:center;margin-bottom:8px}.web .banner b{display:block;font:italic bold 28px var(--chat)}.web .banner span{color:var(--sun);font-size:13px}
.web .new{background:var(--tip);border:1px solid var(--shade);padding:4px 8px}.web .blink{color:var(--me);font-weight:bold}
.web .chan{border-collapse:collapse}.web .chan td{border:1px solid var(--shade);padding:5px 8px;vertical-align:top;font-size:13px}
.web .gb{border-left:3px solid var(--title);padding:2px 8px;margin-bottom:8px}
.web.stars{background:var(--night) radial-gradient(var(--hi) 1px,transparent 1.5px) 0 0/37px 41px;color:var(--lime)}
.web.stars a{color:var(--sun)}.web.stars a.v{color:var(--warn)}.web.stars .small{color:var(--face)}
.web .glow{color:var(--sun);text-align:center;font-family:var(--mono)}.web .ring{text-align:center;border:1px dashed var(--lime);padding:6px}
.web .construct{background:repeating-linear-gradient(45deg,var(--warn) 0 12px,var(--dark) 12px 24px);color:var(--hi);text-shadow:1px 1px var(--dark),-1px -1px var(--dark);font:bold 14px var(--ui);text-align:center;padding:6px;margin-bottom:10px}
.lcd{background:var(--night);border:2px solid;border-color:var(--shade) var(--hi) var(--hi) var(--shade);padding:8px 10px;color:var(--lime);font-family:var(--mono);display:flex;flex-direction:column;gap:4px}
.lcd-big{font:bold 34px/1 var(--mono);letter-spacing:2px}.lcd-sub{font-size:10px;letter-spacing:1px}
.viz{display:flex;align-items:flex-end;gap:2px;height:34px}.viz i{width:5px;height:2px;background:var(--lime)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}a.btn{color:var(--text);text-decoration:none;text-align:center;font-weight:bold}
.web .bb{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:8px}.web .bb th{background:var(--title);color:var(--hi);text-align:left;padding:4px 6px;font:bold 12px var(--ui)}
.web .bb td{border:1px solid var(--shade);padding:5px 7px;vertical-align:top;background:var(--field)}.web .bb tr:nth-child(even) td{background:var(--tip)}.web .bb .n{text-align:center;font-variant-numeric:tabular-nums}
.web .bb .who2{width:96px;background:var(--lite)}.web .bb .body{white-space:pre-wrap;font-size:14px;margin-top:4px}
.picbox{margin-top:8px;max-width:420px}.picframe{position:relative;overflow:hidden;min-height:60px;background:var(--face);line-height:0}
.pic{display:block;width:100%;height:auto}.piccover{position:absolute;left:0;right:0;top:0;bottom:0;backdrop-filter:blur(5px) saturate(.4);border-top:2px solid var(--title)}
.win.maxed{max-width:100%}
body.fs #bar,body.fs #menu{display:none}body.fs #desk{bottom:0}
.mlist{flex:0 0 38%;min-height:70px;overflow-y:auto;padding:0}.mrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 76px;gap:6px;padding:2px 6px}.mrow span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mhead{background:var(--face);border-bottom:1px solid var(--shade);font-weight:bold;position:sticky;top:0}.mrow.unread{font-weight:bold}
.mailread{font-size:14px}.mailread .mbody{white-space:pre-wrap;margin-top:6px}.mailread .small{font-size:12px;color:var(--mute)}.mailread hr{border:0;border-top:1px solid var(--shade);margin:6px 0}
.gfold{display:flex;gap:10px;flex-wrap:wrap;padding:10px;background:var(--field)}.gicon{color:var(--text)}.gicon span{text-shadow:none}
.gamecv{width:100%;aspect-ratio:320/200;max-width:100%;image-rendering:pixelated;background:#000;display:block;outline:0}.gamecv:focus-visible,.snakecv:focus-visible{outline:2px dotted var(--sun)}
.ghud{font:bold 12px var(--mono);background:var(--night);color:var(--lime);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtouch{display:flex;gap:3px}.gtouch .btn{flex:1;touch-action:none;user-select:none}
.snakecv{width:100%;max-width:100%;aspect-ratio:1;image-rendering:pixelated;display:block}
.mgrid{display:grid;grid-template-columns:repeat(9,1fr);padding:0;background:var(--shade);gap:0}
.mc{aspect-ratio:1;min-width:0;padding:0;font:bold 13px var(--ui);background:var(--face);border:2px solid;border-color:var(--hi) var(--shade) var(--shade) var(--hi);cursor:pointer}
.mc.open{border:1px solid var(--shade);background:var(--lite);cursor:default}.mc.flag{color:var(--me)}.mc.mine{background:var(--lite)}.mc.boom{background:var(--me)}
.mlcd{padding:2px 6px;font:bold 18px var(--mono);color:var(--me);min-width:48px;text-align:center}
</style>

  function fire(){if(dead||cool>0)return;if(ammo<=0){msg='OUT OF AMMO';msgT=1;sfx('click');return;}ammo--;cool=.28;shotFlash=.12;sfx('shot');
    let best=null,bd=1e9;for(const e of ents){if(e.k!=='drone'||e.hp<=0)continue;const dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy);let a=Math.atan2(dy,dx)-pa;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)<Math.atan(.3/d)+.02&&d<bd&&sight(px,py,e.x,e.y)){best=e;bd=d;}}
    if(best){best.hp--;best.fl=.15;sfx(best.hp<=0?'die':'hit');if(best.hp<=0){score+=100;ents=ents.filter(x=>x!==best);if(Math.random()<.4)ents.push({k:'ammo',x:best.x,y:best.y});}}}
  const FOV=.66;let last=performance.now();
  function frame(now){
    if(!alive)return;raf=requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(w.min)return;
    if(!dead){
      const rot=((keys.arrowleft||keys.q)?-1:0)+((keys.arrowright||keys.e)?1:0);pa+=rot*2.4*dt+turnM;turnM=0;
      const fw=((keys.arrowup||keys.w)?1:0)-((keys.arrowdown||keys.s)?1:0),st=(keys.d?1:0)-(keys.a?1:0),sp=3*dt;
      const nx=px+(Math.cos(pa)*fw-Math.sin(pa)*st)*sp,ny=py+(Math.sin(pa)*fw+Math.cos(pa)*st)*sp;
      if(map[(py|0)*MW+(nx|0)]===9||map[(ny|0)*MW+(px|0)]===9){score+=250*level;sfx('door');newLevel(level+1);hp=Math.min(100,hp+20);}
      if(free(nx,py))px=nx;if(free(px,ny))py=ny;cool=Math.max(0,cool-dt);
      for(const e of ents){const d=Math.hypot(e.x-px,e.y-py);e.fl=Math.max(0,e.fl-dt);
        if(e.k!=='drone'){if(d<.5){if(e.k==='med'&&hp<100){hp=Math.min(100,hp+25);e.gone=1;sfx('pick');msg='HEALTH +25';msgT=1;}else if(e.k==='ammo'){ammo=Math.min(99,ammo+10);e.gone=1;sfx('pick');msg='AMMO +10';msgT=1;}}continue;}
        const see=d<9&&sight(e.x,e.y,px,py);
        if(see&&d>1.2){const vx=(px-e.x)/d*(1+level*.08)*dt,vy=(py-e.y)/d*(1+level*.08)*dt;if(free(e.x+vx,e.y))e.x+=vx;if(free(e.x,e.y+vy))e.y+=vy;}
        e.cd-=dt;if(see&&e.cd<=0){e.cd=1.4+Math.random()*1.4;if(Math.random()<.55){const dmg=6+Math.floor(Math.random()*6)+level;hp-=dmg;hurtFlash=.25;sfx('hurt');if(hp<=0){hp=0;dead=true;best.set('bunker',score);sfx('boom');}}}}
      ents=ents.filter(e=>!e.gone);msgT=Math.max(0,msgT-dt);
    }
    // ceiling + floor
    for(let y=0;y<H;y++){const t=Math.abs(y-H/2)/(H/2),c=y<H/2?rgb(40*t+10,40*t+12,48*t+16):rgb(70*t+16,58*t+14,44*t+10);buf.fill(c,y*W,y*W+W);}
    const dx0=Math.cos(pa),dy0=Math.sin(pa),plx=-dy0*FOV,ply=dx0*FOV;
    for(let x=0;x<W;x++){const cam=2*x/W-1,rx=dx0+plx*cam,ry=dy0+ply*cam;let mx=px|0,my=py|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);let sx,sy,sdx,sdy,side=0,c=0;
      if(rx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}if(ry<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
      for(let i=0;i<64;i++){if(sdx<sdy){sdx+=ddx;mx+=sx;side=0;}else{sdy+=ddy;my+=sy;side=1;}c=map[my*MW+mx];if(c)break;}
      const pd=Math.max(.05,side?sdy-ddy:sdx-ddx);zb[x]=pd;const lh=H/pd|0,y0=Math.max(0,(H-lh)>>1),y1=Math.min(H,(H+lh)>>1);
      let wx=side?px+pd*rx:py+pd*ry;wx-=Math.floor(wx);const tx=(wx*TS)|0,t=tex[c]||tex[1],shade=Math.max(.18,Math.min(1,1.6/pd))*(side?.75:1);
      for(let y=y0;y<y1;y++){const ty=(((y-(H-lh)/2)*TS/lh)|0)&63,p=t[ty*TS+tx];buf[y*W+x]=rgb((p&255)*shade,((p>>8)&255)*shade,((p>>16)&255)*shade);}}
    const vis=ents.map(e=>({e,d:(e.x-px)**2+(e.y-py)**2})).sort((a,b)=>b.d-a.d);const inv=1/(plx*dy0-dx0*ply);
    for(const {e} of vis){const sx=e.x-px,sy=e.y-py,tX=inv*(dy0*sx-dx0*sy),tY=inv*(-ply*sx+plx*sy);if(tY<=.1)continue;
      const scx=(W/2)*(1+tX/tY)|0,sh=Math.abs(H/tY)|0,sw=sh,y0=(H-sh)>>1,x0=scx-(sw>>1),t=e.fl>0?spr.hit:spr[e.k],shade=Math.max(.25,Math.min(1,1.6/tY));
      for(let x=Math.max(0,x0);x<Math.min(W,x0+sw);x++){if(tY>=zb[x])continue;const tx=((x-x0)*TS/sw)|0;for(let y=Math.max(0,y0);y<Math.min(H,y0+sh);y++){const p=t[(((y-y0)*TS/sh)|0)*TS+tx];if(p)buf[y*W+x]=rgb((p&255)*shade,((p>>8)&255)*shade,((p>>16)&255)*shade);}}}
    ctx.putImageData(img,0,0);
    // weapon + overlays
    const bob=Math.sin(now/120)*((keys.arrowup||keys.w)?3:0);ctx.fillStyle='#3a3a44';ctx.fillRect(W/2-14,H-44+bob,28,44);ctx.fillStyle='#5a5a66';ctx.fillRect(W/2-8,H-60+bob,16,22);ctx.fillStyle='#33ff66';ctx.fillRect(W/2-3,H-62+bob,6,4);
    if(shotFlash>0){shotFlash-=dt;ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(W/2,H-66+bob,9,0,7);ctx.fill();}
    ctx.fillStyle='#33ff66';ctx.fillRect(W/2-1,H/2-5,2,4);ctx.fillRect(W/2-1,H/2+2,2,4);ctx.fillRect(W/2-6,H/2-1,4,2);ctx.fillRect(W/2+3,H/2-1,4,2);
    if(hurtFlash>0){hurtFlash-=dt;ctx.fillStyle='rgba(200,0,0,'+(hurtFlash*1.6)+')';ctx.fillRect(0,0,W,H);}
    ctx.font='bold 14px monospace';ctx.textAlign='center';
    if(msgT>0){ctx.fillStyle='#ffd400';ctx.fillText(msg,W/2,40);}
    if(dead){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#cc0000';ctx.font='bold 22px monospace';ctx.fillText('GAME OVER',W/2,H/2-10);ctx.fillStyle='#ffffff';ctx.font='12px monospace';ctx.fillText('Score '+score+'   Best '+best.get('bunker'),W/2,H/2+12);ctx.fillText('Click or press Enter to play again',W/2,H/2+30);}
    hud.textContent='HEALTH '+hp+'%   AMMO '+ammo+'   SCORE '+score+'   LEVEL '+level+'   DRONES '+ents.filter(e=>e.k==='drone').length;
  }
  raf=requestAnimationFrame(frame);cv.focus();
  w.o.onClose=(f=>()=>{f();document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);})(w.o.onClose);
}

/* --- Mines --- */
function showMines(){
  const w=openWin('mines',{title:'Mines',w:250});if(w.body.firstChild)return;
  const N=9,M=10;let cells,over,started,t0,tick=0,flagMode=false,left;
  const cnt=h('div',{class:'lcd mlcd',text:'010'}),tm=h('div',{class:'lcd mlcd',text:'000'}),face=h('button',{class:'btn',type:'button',text:'New',onclick:()=>reset()}),fm=h('button',{class:'btn',type:'button',text:'Flag: off',onclick:()=>{flagMode=!flagMode;fm.textContent='Flag: '+(flagMode?'on':'off');fm.classList.toggle('on',flagMode);}});
  const grid=h('div',{class:'mgrid in',role:'grid','aria-label':'Mine field'});
  w.body.append(h('div',{class:'row',style:'justify-content:space-between;flex-wrap:nowrap'},cnt,face,tm),grid,h('div',{class:'row',style:'justify-content:space-between'},fm,h('span',{class:'note',text:'Right-click or Flag mode marks a mine.'})));
  w.o.onClose=()=>clearInterval(tick);
  const COL=['','#0000cc','#007a00','#cc0000','#000080','#800000','#008080','#0a0a0a','#808080'];
  function reset(){over=false;started=false;clearInterval(tick);tm.textContent='000';left=N*N-M;cells=Array.from({length:N*N},(_,i)=>({i,m:false,o:false,f:false,n:0}));grid.textContent='';
    for(const c of cells){c.el=h('button',{class:'mc',type:'button','aria-label':'Hidden square'});c.el.addEventListener('click',()=>flagMode?flag(c):open(c));c.el.addEventListener('contextmenu',e=>{e.preventDefault();flag(c);});grid.append(c.el);}paintCount();}
  const nb=c=>{const x=c.i%N,y=(c.i/N)|0,r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if((dx||dy)&&nx>=0&&ny>=0&&nx<N&&ny<N)r.push(cells[ny*N+nx]);}return r;};
  function plant(safe){const pool=cells.filter(c=>c!==safe&&!nb(safe).includes(c)).sort(()=>Math.random()-.5).slice(0,M);pool.forEach(c=>c.m=true);cells.forEach(c=>c.n=nb(c).filter(x=>x.m).length);started=true;t0=Date.now();tick=setInterval(()=>{tm.textContent=String(Math.min(999,(Date.now()-t0)/1000|0)).padStart(3,'0');},500);}
  function paintCount(){cnt.textContent=String(M-cells.filter(c=>c.f).length).padStart(3,'0');}
  function flag(c){if(over||c.o)return;c.f=!c.f;c.el.textContent=c.f?'⚑':'';c.el.classList.toggle('flag',c.f);c.el.setAttribute('aria-label',c.f?'Flagged':'Hidden square');sfx('click');paintCount();}
  function open(c){if(over||c.f||c.o)return;if(!started)plant(c);
    if(c.m){over=true;clearInterval(tick);sfx('boom');cells.forEach(x=>{if(x.m){x.el.textContent='✹';x.el.classList.add('mine');}});c.el.classList.add('boom');face.textContent='Try Again';return;}
    const st=[c];while(st.length){const x=st.pop();if(x.o||x.f)continue;x.o=true;left--;x.el.classList.add('open');x.el.textContent=x.n||'';x.el.style.color=COL[x.n];x.el.setAttribute('aria-label',x.n?x.n+' mines nearby':'Empty');if(!x.n)st.push(...nb(x).filter(y=>!y.o));}
    sfx('click');if(left===0){over=true;clearInterval(tick);const s=(Date.now()-t0)/1000|0;face.textContent='You Win!';sfx('door');cells.forEach(x=>{if(x.m){x.f=true;x.el.textContent='⚑';x.el.classList.add('flag');}});paintCount();
      const b=+store.get('dt-best-mines','0');if(!b||s<b)store.set('dt-best-mines',String(s));msgBox('Mines','You cleared the field in '+s+' seconds.'+(b&&s>=b?' Your best is '+b+' seconds.':' That is your best time!'),false);}}
  reset();
}

/* --- Snake --- */
function showSnake(){
  if(wins.has('snake'))return focusWin('snake');
  const N=20,S=14;let snake,dir,next,food,score,alive=false,timer=0;
  const w=openWin('snake',{title:'Snake',w:N*S+30,onClose:()=>{clearInterval(timer);document.removeEventListener('keydown',kd);}});
  const cv=h('canvas',{width:N*S,height:N*S,class:'snakecv',tabindex:'0','aria-label':'Snake game. Arrow keys to steer.'}),info=h('div',{class:'ghud'});
  const pad=h('div',{class:'gtouch'});const tb=(l,d)=>{const b=h('button',{class:'btn',type:'button',text:l});b.addEventListener('pointerdown',e=>{e.preventDefault();turn(d);});return b;};
  pad.append(tb('◄',[-1,0]),tb('▲',[0,-1]),tb('▼',[0,1]),tb('►',[1,0]),h('button',{class:'btn',type:'button',text:'Start',onclick:()=>start()}));
  w.body.append(cv,info,pad);const g=cv.getContext('2d');
  function turn(d){if(!alive)return start();if(d[0]!==-dir[0]||d[1]!==-dir[1])next=d;}
  const kd=e=>{if(document.activeElement!==cv)return;const m={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key.toLowerCase()];if(m){e.preventDefault();turn(m);}else if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!alive)start();}};
  document.addEventListener('keydown',kd);cv.addEventListener('click',()=>{cv.focus();actx();if(!alive)start();});
  function place(){do{food=[Math.random()*N|0,Math.random()*N|0];}while(snake.some(p=>p[0]===food[0]&&p[1]===food[1]));}
  function start(){snake=[[9,10],[8,10],[7,10]];dir=next=[1,0];score=0;alive=true;place();clearInterval(timer);timer=setInterval(step,140);cv.focus();draw();}
  function step(){dir=next;const hd=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
    if(hd[0]<0||hd[1]<0||hd[0]>=N||hd[1]>=N||snake.some(p=>p[0]===hd[0]&&p[1]===hd[1])){alive=false;clearInterval(timer);best.set('snake',score);sfx('boom');draw();return;}
    snake.unshift(hd);if(hd[0]===food[0]&&hd[1]===food[1]){score+=10;sfx('eat');place();if(score%50===0){clearInterval(timer);timer=setInterval(step,Math.max(60,140-score));}}else snake.pop();draw();}
  function draw(){g.fillStyle='#000022';g.fillRect(0,0,N*S,N*S);g.fillStyle='#cc0000';g.fillRect(food[0]*S+2,food[1]*S+2,S-4,S-4);
    snake.forEach((p,i)=>{g.fillStyle=i?'#22bb55':'#33ff66';g.fillRect(p[0]*S+1,p[1]*S+1,S-2,S-2);});
    if(!alive){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,N*S,N*S);g.fillStyle='#ffd400';g.font='bold 18px monospace';g.textAlign='center';g.fillText(score?'GAME OVER':'SNAKE',N*S/2,N*S/2-8);g.fillStyle='#ffffff';g.font='12px monospace';g.fillText('Click or press Enter to play',N*S/2,N*S/2+14);}
    info.textContent='SCORE '+score+'   BEST '+best.get('snake');}
  snake=[[9,10],[8,10],[7,10]];food=[14,10];score=0;draw();
}

startBtn.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;startBtn.classList.toggle('on',!menu.hidden);});

document.addEventListener('click',()=>{menu.hidden=true;startBtn.classList.remove('on');});
const clock=$('#clock');const tk=()=>{clock.textContent=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});};tk();setInterval(tk,15000);
